<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Karim Renewables Energy Data Sheet</title>
    <!-- Load the official Jotform Custom Widget API -->
    <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 10px;
            color: #222;
            background: #fff;
            margin: 0;
        }
        h2 {
            font-size: 16px;
            color: #0c3b2e;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            min-width: 650px;
        }
        th, td {
            border: 1px solid #d1d5db;
            padding: 8px;
            text-align: center;
            font-size: 13px;
        }
        th {
            background-color: #0c3b2e;
            color: #ffffff;
            font-weight: 600;
        }
        td.left-align {
            text-align: left;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }
        input.appliance-input {
            text-align: left;
        }
        .calculated-cell {
            background-color: #f9fafb;
            font-weight: 500;
            color: #374151;
        }
        button {
            background-color: #0c3b2e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        button.delete-btn {
            background-color: #dc2626;
            padding: 5px 8px;
            font-size: 12px;
        }
        button:hover {
            opacity: 0.9;
        }
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .summary-box {
            background-color: #f3f4f6;
            border: 1px solid #d1d5db;
            padding: 10px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            color: #1f2937;
        }
        .summary-box span {
            color: #0c3b2e;
        }
    </style>
</head>
<body>

    <h2>Karim Renewables Energy Data Sheet</h2>

    <div class="table-responsive">
        <table id="dataTable">
            <thead>
                <tr>
                    <th style="width: 50px;">No.</th>
                    <th>Appliances</th>
                    <th style="width: 70px;">Quantity</th>
                    <th style="width: 90px;">Unit Load (W)</th>
                    <th style="width: 90px;">Total Load (W)</th>
                    <th style="width: 90px;">Run Time (hrs)</th>
                    <th style="width: 100px;">Energy (Wh)</th>
                    <th style="width: 50px;">Action</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Rows will be dynamically populated -->
            </tbody>
        </table>
    </div>

    <div class="actions-bar">
        <button type="button" id="addRowBtn">+ Add Appliance</button>
    </div>

    <div class="summary-box">
        <div>Gross Total Load: <span id="grossTotalLoad">0.00</span> W</div>
        <div>Energy Demand: <span id="energyDemand">0.00</span> Wh</div>
    </div>

    <script>
        const tableBody = document.getElementById('tableBody');
        const addRowBtn = document.getElementById('addRowBtn');
        const grossTotalLoadSpan = document.getElementById('grossTotalLoad');
        const energyDemandSpan = document.getElementById('energyDemand');

        // Re-index row numbers automatically
        function updateRowNumbers() {
            const rows = tableBody.querySelectorAll('tr');
            rows.forEach((row, index) => {
                row.querySelector('.row-number').textContent = index + 1;
            });
        }

        // Add a new row to the table
        function addRow(data = { appliance: '', qty: 1, unitLoad: 0, runTime: 0 }) {
            const row = document.createElement('tr');
            
            row.innerHTML = `
                <td class="row-number"></td>
                <td class="left-align"><input type="text" class="appliance-input" value="${data.appliance}" placeholder="Appliance name..."></td>
                <td><input type="number" class="qty-input" value="${data.qty}" min="0" step="1"></td>
                <td><input type="number" class="unit-load-input" value="${data.unitLoad}" min="0" step="0.1"></td>
                <td class="calculated-cell total-load-cell">0.00</td>
                <td><input type="number" class="runtime-input" value="${data.runTime}" min="0" step="0.1"></td>
                <td class="calculated-cell energy-cell">0.00</td>
                <td><button type="button" class="delete-btn">X</button></td>
            `;

            // Bind live calculation & auto-saving listeners to inputs
            row.querySelectorAll('input').forEach(input => {
                input.addEventListener('input', () => {
                    calculateRowAndTotals();
                    saveToLocalStorage();
                });
            });

            // Bind delete button listener
            row.querySelector('.delete-btn').addEventListener('click', function() {
                row.remove();
                updateRowNumbers();
                calculateRowAndTotals();
                saveToLocalStorage();
            });

            tableBody.appendChild(row);
            updateRowNumbers();
            calculateRowAndTotals();
        }

        // Perform calculations for each row and sum up the grand totals
        function calculateRowAndTotals() {
            const rows = tableBody.querySelectorAll('tr');
            let grossTotalLoad = 0;
            let totalEnergyDemand = 0;

            rows.forEach(row => {
                const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
                const unitLoad = parseFloat(row.querySelector('.unit-load-input').value) || 0;
                const runTime = parseFloat(row.querySelector('.runtime-input').value) || 0;

                const totalLoad = qty * unitLoad;
                const energyWh = runTime * totalLoad;

                row.querySelector('.total-load-cell').textContent = totalLoad.toFixed(2);
                row.querySelector('.energy-cell').textContent = energyWh.toFixed(2);

                grossTotalLoad += totalLoad;
                totalEnergyDemand += energyWh;
            });

            grossTotalLoadSpan.textContent = grossTotalLoad.toFixed(2);
            energyDemandSpan.textContent = totalEnergyDemand.toFixed(2);

            // Resize iframe inside Jotform if active
            if (typeof JFCustomWidget !== 'undefined' && JFCustomWidget.setWidgetHeight) {
                JFCustomWidget.setWidgetHeight(document.body.scrollHeight + 30);
            }
        }

        // Extract structured table data
        function getTableData() {
            const rows = tableBody.querySelectorAll('tr');
            const dataArray = [];

            rows.forEach((row, index) => {
                dataArray.push({
                    no: index + 1,
                    appliance: row.querySelector('.appliance-input').value,
                    quantity: row.querySelector('.qty-input').value,
                    unitLoadInWatt: row.querySelector('.unit-load-input').value,
                    totalLoadInWatt: row.querySelector('.total-load-cell').textContent,
                    runTimeInHours: row.querySelector('.runtime-input').value,
                    energyInWh: row.querySelector('.energy-cell').textContent
                });
            });

            return {
                appliances: dataArray,
                grossTotalLoad: grossTotalLoadSpan.textContent,
                energyDemand: energyDemandSpan.textContent
            };
        }

        // Save data automatically to browser storage
        function saveToLocalStorage() {
            const data = getTableData();
            localStorage.setItem('karim_renewables_saved_data', JSON.stringify(data));
        }

        // Load data from browser storage or Jotform submission history
        function loadSavedData() {
            let savedDataString = null;

            // Check localStorage first for offline/standalone usage
            const localData = localStorage.getItem('karim_renewables_saved_data');
            if (localData) {
                savedDataString = localData;
            }

            return savedDataString;
        }

        addRowBtn.addEventListener('click', () => {
            addRow();
            saveToLocalStorage();
        });

        // --- Jotform API & Initialization Integration ---
        let isJotformInitialized = false;

        function initializeTable(rawJsonData) {
            try {
                const parsed = JSON.parse(rawJsonData);
                tableBody.innerHTML = '';
                const items = parsed.appliances || parsed; 
                if (Array.isArray(items) && items.length > 0) {
                    items.forEach(item => {
                        addRow({
                            appliance: item.appliance || item.item || '',
                            qty: item.quantity || item.qty || 1,
                            unitLoad: item.unitLoadInWatt || item.unitLoad || 0,
                            runTime: item.runTimeInHours || item.runTime || 0
                        });
                    });
                } else {
                    addRow();
                }
            } catch(e) {
                addRow();
            }
        }

        // If inside Jotform, listen to Jotform ready event
        if (typeof JFCustomWidget !== 'undefined') {
            JFCustomWidget.subscribe("ready", function(data) {
                isJotformInitialized = true;
                if (data.value) {
                    initializeTable(data.value);
                } else {
                    // Fallback to local storage if Jotform is blank, or start fresh
                    const localFallback = loadSavedData();
                    if (localFallback) {
                        initializeTable(localFallback);
                    } else {
                        addRow();
                    }
                }
            });

            JFCustomWidget.subscribe("submit", function() {
                const formSubmissionData = getTableData();
                JFCustomWidget.sendSubmit({
                    valid: true,
                    value: JSON.stringify(formSubmissionData)
                });
            });
        }

        // If running standalone (outside Jotform, like github.io link or offline file)
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (!isJotformInitialized) {
                    const localData = loadSavedData();
                    if (localData) {
                        initializeTable(localData);
                    } else {
                        addRow(); // Default blank row
                    }
                }
            }, 200); // Small timeout to wait for Jotform API check
        });
    </script>
</body>
</html>
